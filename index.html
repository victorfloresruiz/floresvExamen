<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca · Reserves</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Biblioteca</h1>

    <div class="row g-4">
      <div class="col-12 col-md-7">
        <h2 class="h4">Llibres disponibles</h2>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Títol</th>
                <th>Autor</th>
                <th>Gènere</th>
                <th>Any</th>
              </tr>
            </thead>
            <tbody id="taulaLlibres"></tbody>
          </table>
        </div>
      </div>

      <div class="col-12 col-md-5">
        <h2 class="h4">Reservar un llibre</h2>
        <div class="card mb-4">
          <div class="card-body">
            <label for="selectorLlibre" class="form-label">Llibre</label>
            <select id="selectorLlibre" class="form-select mb-3"></select>
            <button id="botoReservar" type="button" class="btn btn-primary">Reservar</button>
            <div id="missatge" class="mt-3"></div>
          </div>
        </div>

        <h2 class="h4">Reserves</h2>
        <ul id="llistaReserves" class="list-group"></ul>
      </div>
    </div>
  </div>

  <script>
    // Array de libros
    const llibres = [
        { id: 1, titol: "1984", autor: "George Orwell", genere: "Distopia", any: 1949 },
        { id: 2, titol: "Orgullo y Prejuicio", autor: "Jane Austen", genere: "Romance", any: 1813 },
        { id: 3, titol: "Cien años de soledad", autor: "Gabriel García Márquez", genere: "Realisme màgic", any: 1967 },
        { id: 4, titol: "El Gran Gatsby", autor: "F. Scott Fitzgerald", genere: "Tragèdia", any: 1925 },
        { id: 5, titol: "Matar a un ruiseñor", autor: "Harper Lee", genere: "Ficció", any: 1960 }
    ];

    // Array de reservas (comienza vacia)
    const reserves = [];

    // Llena la tabla con los libros
    function carregarTaula(){
        let html = "";
        for(const llibre of llibres){
            html += `
                <tr>
                    <td>${llibre.titol}</td>
                    <td>${llibre.autor}</td>
                    <td>${llibre.genere}</td>
                    <td>${llibre.any}</td>
                </tr>
            `;
        }
        document.querySelector("#taulaLlibres").innerHTML = html;
    }

    // Llena el selector con los libros
    // El value es la posicion de cada libro dentro del array
    function carregarSelector() {
        let html = '<option value="">Selecciona un llibre</option>';
        for (let i = 0; i < llibres.length; i++) {
            html = html + '<option value="' + i + '">' + llibres[i].titol + '</option>';
        }
        document.querySelector("#selectorLlibre").innerHTML = html;
    }

    // Muestra la lista de reservas
    function mostrarReserves() {
      let html = "";
      for (let i = reserves.length - 1; i >= 0; i--) {
        html = html + '<li class="list-group-item">';
        html = html + '<strong>' + reserves[i].titol + '</strong><br>';
        html = html + reserves[i].autor + '<br>';
        html = html + '<small class="text-muted">' + reserves[i].data + '</small>';
        html = html + '</li>';
      }
      document.querySelector("#llistaReserves").innerHTML = html;
    }

    // Cuando se clica el boton reservar
    function reservar() {
        const valor = document.querySelector("#selectorLlibre").value;

        // Si no se ha escogido ningun libro salta mensaje de error
        if (valor == "") {
            document.querySelector("#missatge").innerHTML =
            '<div class="alert alert-warning">Has de seleccionar un llibre abans de reservar.</div>';
            return;
        }

        // valor es la posicion del libro en el array
        const llibre = llibres[valor];

        // Data y hora actual
        const ara = new Date();

        // Se crea la reserva y se añade a la array
        const reserva = {
            titol: llibre.titol,
            autor: llibre.autor,
            data: ara.toLocaleString()
        };
        reserves.push(reserva);

        document.querySelector("#missatge").innerHTML =
            '<div class="alert alert-success">Reserva feta: ' + llibre.titol + '</div>';

        mostrarReserves();
    }

    // evento del boton reservar
    document.querySelector("#botoReservar").addEventListener("click", reservar);

    // Al cargar la pagina
    carregarTaula();
    carregarSelector();
  </script>
</body>
</html>
